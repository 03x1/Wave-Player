<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An Apple Music–style mini player for Spotify">
<title>Wave Player</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  background:#0b0b0d;color:#fff;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:40px;padding:48px 16px;
}
header{text-align:center}
h1{font-size:34px;font-weight:700;letter-spacing:-.025em}
p{margin-top:8px;font-size:15px;color:rgba(255,255,255,.55)}
nav{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
nav a{font-size:13px;font-weight:600;color:#fff;text-decoration:none;padding:8px 14px;border-radius:9px;
  background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14);transition:background .15s}
nav a:hover{background:rgba(255,255,255,.15)}
.row{display:flex;gap:36px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:100%}
figure{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%}
figcaption{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.4)}
/* Stand-in for the PiP window; the player sizes it. */
iframe.pip{display:block;border:0;border-radius:12px;background:#141417;max-width:100%;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.14)}
iframe.host{position:absolute;width:0;height:0;border:0;visibility:hidden}
/* Full screen: a 1920×1080 screen, scaled to fit. */
.screen{position:relative;width:min(1240px,100%);aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#141417;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.14)}
.screen iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0}
</style>
</head>
<body>

<header>
  <h1>Wave Player</h1>
  <p>An Apple Music–style mini player for Spotify.</p>
  <nav>
    <a href="https://github.com/03x1/Wave-Player#install">Install</a>
    <a href="https://github.com/03x1/Wave-Player">GitHub</a>
  </nav>
</header>

<!-- Each window runs the real waveplayer.js (no audio). -->
<div class="row">
  <figure><iframe class="pip" id="pipCompact"  title="Compact player"  style="width:440px;height:192px"></iframe><figcaption>Compact</figcaption></figure>
  <figure><iframe class="pip" id="pipExpanded" title="Expanded player" style="width:440px;height:436px"></iframe><figcaption>Expanded</figcaption></figure>
  <figure><iframe class="pip" id="pipLyrics"   title="Lyrics"          style="width:440px;height:620px"></iframe><figcaption>Lyrics</figcaption></figure>
</div>
<figure style="width:100%"><div class="screen" id="screen"></div><figcaption>Full screen</figcaption></figure>

<script>
// One hidden host frame per window (fake Spotify + the player). Started one at a time
// because they share storage, where the player reads its starting view.
const HOSTS = [
  { pip: 'pipCompact',  mode: 'compact',  song: 0, pos: 64000 },                    // Sonder — What You Heard
  { pip: 'pipExpanded', mode: 'expanded', song: 1, pos: 61000 },                    // Drake — CN TOWER, with its Canvas
  { pip: 'pipLyrics',   mode: 'compact',  song: 2, pos: 66000, panel: 'lyrics' },   // Ichiko Aoba — Dawn in the Adan
  { full: '1',          mode: 'compact',  song: 3, pos: 132500, panel: 'lyrics' },  // Drake — Tuscan Leather, full screen
];
const screen = document.getElementById('screen');
(async () => {
  for (const h of HOSTS) {
    const f = document.createElement('iframe');
    // The full screen host is the screen itself.
    if (h.full) f.title = 'Full screen player';
    else { f.className = 'host'; f.setAttribute('aria-hidden', 'true'); }
    Object.assign(f.dataset, h);
    f.srcdoc = '<!DOCTYPE html><body><script src="demo/spotify-mock.js"><\/script><script src="waveplayer.js"><\/script></body>';
    await new Promise(res => { f.addEventListener('opened', res, { once: true }); (h.full ? screen : document.body).appendChild(f); });
  }
})();
const fit = () => { const f = screen.querySelector('iframe'); if (f) f.style.transform = `scale(${screen.clientWidth / 1920})`; };
new ResizeObserver(fit).observe(screen);
new MutationObserver(fit).observe(screen, { childList: true });
</script>
</body>
</html>
